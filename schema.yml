components:
  schemas:
    Autor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
          maxLength: 200
      required:
      - id
      - nome
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        descricao:
          type: string
          maxLength: 100
      required:
      - descricao
      - id
    Compra:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        data:
          type: string
          format: date-time
          readOnly: true
        tipo_pagamento:
          type: string
          readOnly: true
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItensCompra'
          readOnly: true
      required:
      - data
      - id
      - itens
      - status
      - tipo_pagamento
      - total
      - usuario
    CompraCreateUpdate:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItensCompraCreateUpdate'
      required:
      - itens
    CompraList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: string
          readOnly: true
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItensCompraList'
          readOnly: true
      required:
      - id
      - itens
      - usuario
    DocumentUpload:
      type: object
      properties:
        attachment_key:
          type: string
          format: uuid
          readOnly: true
          description: Used to attach the document to another object. Cannot be used
            to retrieve the document file.
        file:
          type: string
          format: uri
          writeOnly: true
        description:
          type: string
          maxLength: 255
        uploaded_on:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment_key
      - file
      - uploaded_on
    Editora:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        site:
          type: string
          format: uri
          nullable: true
          maxLength: 100
        nome:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          nullable: true
          maxLength: 100
        cidade:
          type: string
          nullable: true
          maxLength: 100
      required:
      - id
      - nome
    Image:
      type: object
      properties:
        url:
          type: string
          readOnly: true
        description:
          type: string
          maxLength: 255
        uploaded_on:
          type: string
          format: date-time
          readOnly: true
      required:
      - uploaded_on
      - url
    ImageUpload:
      type: object
      properties:
        attachment_key:
          type: string
          format: uuid
          readOnly: true
          description: Used to attach the image to another object. Cannot be used
            to retrieve the image file.
        file:
          type: string
          format: uri
          writeOnly: true
        description:
          type: string
          maxLength: 255
        uploaded_on:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          readOnly: true
      required:
      - attachment_key
      - file
      - uploaded_on
      - url
    ItensCompra:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        livro:
          allOf:
          - $ref: '#/components/schemas/Nested'
          readOnly: true
        titulo:
          type: string
          readOnly: true
        quantidade:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - livro
      - titulo
      - total
    ItensCompraCreateUpdate:
      type: object
      properties:
        livro:
          type: integer
        quantidade:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
      required:
      - livro
    ItensCompraList:
